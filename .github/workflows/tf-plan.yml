# Plan và comment kết quả lên PR khi PR đụng infra/** hoặc adf/** (docs/devops/04, mục 3.2).
# adf/** chỉ kích hoạt stack 40-orchestration (bộ lọc detect), để PR chỉ thêm JSON của P2 vẫn có plan.
# bootstrap (P1 chạy tay) và 90-sandbox (P4 chạy tay) không nằm trong CI.
name: tf-plan

on:
  pull_request:
    paths: ["infra/**", "adf/**"]

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: tf-plan-${{ github.head_ref }}
  cancel-in-progress: true

env:
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_A }}
  TF_VAR_subscription_id_a: ${{ vars.AZURE_SUBSCRIPTION_A }}
  TF_VAR_subscription_id_b: ${{ vars.AZURE_SUBSCRIPTION_B }}
  TF_VAR_tfstate_account: ${{ vars.TFSTATE_ACCOUNT }}
  TF_VAR_member_object_ids: ${{ vars.TF_VAR_MEMBER_OBJECT_IDS }}
  TF_VAR_databricks_app_object_id: ${{ vars.TF_VAR_DATABRICKS_APP_OBJECT_ID }}
  TF_VAR_member_ips: ${{ vars.TF_VAR_MEMBER_IPS }}

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      stacks: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            10-core:
              - infra/stacks/10-core/**
              - infra/modules/**
              - infra/envs/10-core.tfvars
            20-stream:
              - infra/stacks/20-stream/**
              - infra/modules/**
              - infra/envs/20-stream.tfvars
            30-databricks:
              - infra/stacks/30-databricks/**
              - infra/envs/30-databricks.tfvars
            40-orchestration:
              - infra/stacks/40-orchestration/**
              - infra/envs/40-orchestration.tfvars
              - adf/**

  plan:
    needs: detect
    if: needs.detect.outputs.stacks != '[]' && needs.detect.outputs.stacks != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJson(needs.detect.outputs.stacks) }}
    # Secret chỉ cấp cho job plan, job detect không cần.
    env:
      TF_VAR_member_emails: ${{ secrets.TF_VAR_MEMBER_EMAILS }}
      TF_VAR_member_upns: ${{ secrets.TF_VAR_MEMBER_UPNS }}
    defaults:
      run:
        working-directory: infra/stacks/${{ matrix.stack }}
    steps:
      - uses: actions/checkout@v4
      # Repo public: log ai cũng xem được. Che subscription, tenant, object ID, IP trước mọi bước khác.
      - name: Che giá trị riêng trong log
        working-directory: .
        run: scripts/ci/mask_private_values.sh
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_A }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.x"
          terraform_wrapper: false
      - run: >-
          terraform init -input=false
          -backend-config=../../backend.hcl
          -backend-config="storage_account_name=${{ vars.TFSTATE_ACCOUNT }}"
      # Plan đầy đủ chỉ in ra log (đã che ID). Comment trên PR chỉ có tóm tắt (scripts/ci/plan_summary.sh).
      - id: plan
        run: |
          set +e
          terraform plan -input=false -no-color -lock-timeout=5m \
            -var-file=../../envs/${{ matrix.stack }}.tfvars -out=tfplan > plan.log 2>&1
          code=$?
          set -e
          cat plan.log
          if [ $code -eq 0 ]; then
            "$GITHUB_WORKSPACE/scripts/ci/plan_summary.sh" plan.log tfplan
          else
            "$GITHUB_WORKSPACE/scripts/ci/plan_summary.sh" plan.log
          fi
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
      - uses: actions/github-script@v7
        env:
          STACK: ${{ matrix.stack }}
          PLAN_EXIT: ${{ steps.plan.outputs.exitcode }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require('fs');
            const dir = `infra/stacks/${process.env.STACK}`;
            const read = f => (fs.existsSync(`${dir}/${f}`) ? fs.readFileSync(`${dir}/${f}`, 'utf8').trim() : '');
            const ok = process.env.PLAN_EXIT === '0';
            const totals = read('totals.txt');
            const changes = read('summary.txt').split('\n').filter(Boolean);
            const destroys = changes.filter(l => l.split('\t')[0].includes('delete'));
            const lines = changes.map(l => { const [a, addr] = l.split('\t'); return `${a.padEnd(14)} ${addr}`; });
            let list = lines.join('\n');
            if (list.length > 60000) list = list.slice(0, 60000) + '\n… (đã cắt bớt)';
            const marker = `<!-- tf-plan:${process.env.STACK} -->`;
            let text = `${marker}\n### terraform plan · \`${process.env.STACK}\` ${ok ? '✅' : '❌'}\n\n`;
            text += ok ? `**${totals}**\n` : `Plan lỗi:\n\n\`\`\`\n${totals || 'Không trích được dòng Error, xem log.'}\n\`\`\`\n`;
            if (destroys.length) text += `\n> ⚠️ **Có ${destroys.length} tài nguyên bị xóa hoặc tạo lại.** Kiểm kỹ trước khi duyệt.\n`;
            if (ok && lines.length) text += `\n<details><summary>Tài nguyên thay đổi hoặc bị lệch ngoài Terraform (${lines.length})</summary>\n\n\`\`\`\n${list}\n\`\`\`\n</details>\n`;
            text += `\nPlan đầy đủ (đã che ID) nằm trong [log của job](${process.env.RUN_URL}). Comment chỉ có tóm tắt vì repo public.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const old = comments.find(c => c.body.startsWith(marker));
            if (old) await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body: text });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body: text });
      - if: steps.plan.outputs.exitcode != '0'
        run: exit 1
