# Đồng bộ `Status` (Blocked/Ready/Review/Needs Update/Done) và `Waiting on` trên GitHub Project #8
# theo PR và phụ thuộc giữa các task (docs/tasks/README.md).
# Token mặc định của Actions không ghi được vào Project của tài khoản cá nhân, nên dùng secret `PROJECT_TOKEN`:
# PAT classic chỉ cần scope `project`; repo public nên đọc issue không cần scope `repo`.
# Kéo thẻ giữa các cột trên Project không phát sự kiện cho repo, nên có thêm lịch chạy định kỳ.
name: sync-task-board

on:
  issues:
    types: [closed, reopened]
  # pull_request_target chạy bản workflow trên main và không chạy code của PR, nên an toàn với secret.
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, edited, closed]
  pull_request_review:
    types: [submitted, dismissed]
  issue_comment:
    types: [created]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# Mỗi lần chạy đồng bộ cả board, nên chỉ cần một lần chạy đang chờ là đủ.
concurrency:
  group: sync-task-board
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
    steps:
      - name: Kiểm tra secret
        id: token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Chưa có secret PROJECT_TOKEN (hoặc PR từ fork), bỏ qua đồng bộ board."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Đồng bộ board
        if: steps.token.outputs.ok == 'true'
        run: python3 scripts/sync_task_board.py --apply
