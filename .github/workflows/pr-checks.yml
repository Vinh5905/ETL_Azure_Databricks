# Kiểm tra tĩnh trên mọi PR (docs/devops/04, mục 3.1).
# Status check bắt buộc trong branch protection: terraform, trivy, python, java, bundle
# (cùng title, commits, body của pr-lint). `cost` không bắt buộc.
name: pr-checks

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  id-token: write # chỉ job bundle dùng, và chỉ khi đã có DATABRICKS_HOST

concurrency:
  group: pr-checks-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  terraform-dir:
    # Matrix sinh check tên `terraform (<thư mục>)`; branch protection không bắt được
    # từng tên này, nên job `terraform` ở dưới gom kết quả thành một check bắt buộc.
    name: terraform (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - bootstrap
          - modules/naming_tags
          - modules/dbx_workspace
          - stacks/10-core
          - stacks/20-stream
          - stacks/30-databricks
          - stacks/40-orchestration
          - stacks/50-serving
          - stacks/90-sandbox
    defaults:
      run:
        working-directory: infra/${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.x"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate -no-color
      - uses: terraform-linters/setup-tflint@v4
      - run: tflint --init --config="$GITHUB_WORKSPACE/.tflint.hcl"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: tflint --config="$GITHUB_WORKSPACE/.tflint.hcl" --format=compact

  terraform:
    # Check bắt buộc: chỉ xanh khi mọi thư mục trong matrix đều xanh.
    needs: terraform-dir
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gom kết quả matrix
        run: |
          echo "terraform-dir: ${{ needs.terraform-dir.result }}"
          test "${{ needs.terraform-dir.result }}" = "success"

  trivy:
    # Chặn merge khi có lỗi HIGH/CRITICAL. Ngoại lệ có lý do: `#trivy:ignore:<id>` tại resource,
    # hoặc .trivyignore.yaml ở gốc repo (cho thư mục không sửa được như bootstrap).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_IGNOREFILE: .trivyignore.yaml
        with:
          scan-type: config
          scan-ref: infra
          severity: HIGH,CRITICAL
          exit-code: "1"

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-java@v4 # pyspark cần JVM
        with:
          distribution: temurin
          java-version: "17"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  java:
    # Luôn chạy để làm check bắt buộc; chỉ build Maven khi PR đụng src/mapreduce/** (docs/ds/03 §4.3).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changed
        with:
          filters: |
            mr:
              - "src/mapreduce/**"
      - name: Bỏ qua khi không đụng MapReduce
        if: steps.changed.outputs.mr != 'true'
        run: echo "::notice::PR không đụng src/mapreduce/**, bỏ qua mvn verify."
      - uses: actions/setup-java@v4
        if: steps.changed.outputs.mr == 'true'
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
      - run: mvn -B verify
        if: steps.changed.outputs.mr == 'true'
        working-directory: src/mapreduce

  cost:
    # Infracost: comment chi phí ước tính tăng/giảm lên PR đụng infra/** (bằng chứng chi phí, rubric 5.4).
    # Chỉ đọc HCL, không đăng nhập Azure. Không bắt buộc; thiếu secret (vd. PR từ fork) thì bỏ qua.
    runs-on: ubuntu-latest
    env:
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changed
        with:
          filters: |
            infra:
              - "infra/**"
      - name: Bỏ qua khi không cần
        if: steps.changed.outputs.infra != 'true' || env.INFRACOST_API_KEY == ''
        run: echo "::notice::PR không đụng infra/** hoặc chưa có secret INFRACOST_API_KEY, bỏ qua Infracost."
      - uses: infracost/actions/setup@v3
        if: steps.changed.outputs.infra == 'true' && env.INFRACOST_API_KEY != ''
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
      - name: Chi phí của nhánh gốc
        if: steps.changed.outputs.infra == 'true' && env.INFRACOST_API_KEY != ''
        run: |
          git fetch --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          git worktree add /tmp/base "${{ github.event.pull_request.base.sha }}"
          infracost breakdown --path=/tmp/base/infra --format=json --out-file=/tmp/base.json
      - name: Chênh lệch và comment lên PR
        if: steps.changed.outputs.infra == 'true' && env.INFRACOST_API_KEY != ''
        run: |
          infracost diff --path=infra --compare-to=/tmp/base.json --format=json --out-file=/tmp/diff.json
          infracost comment github --path=/tmp/diff.json \
            --repo="${{ github.repository }}" \
            --pull-request="${{ github.event.pull_request.number }}" \
            --github-token="${{ github.token }}" \
            --behavior=update

  bundle:
    # `bundle validate` cần workspace (lookup cluster policy theo tên).
    # Trước G1 chưa có DATABRICKS_HOST nên job chỉ in thông báo và báo xanh.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bỏ qua khi chưa có workspace
        if: vars.DATABRICKS_HOST == ''
        run: echo "::notice::Không có GitHub Variable DATABRICKS_HOST (chưa tới G1 hoặc PR từ fork), bỏ qua bundle validate. PR từ fork tự chạy bundle validate từ máy (CONTRIBUTING.md §3)."
      - uses: azure/login@v2
        if: vars.DATABRICKS_HOST != ''
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_A }}
      - uses: databricks/setup-cli@main
        if: vars.DATABRICKS_HOST != ''
      - run: databricks bundle validate -t dev
        if: vars.DATABRICKS_HOST != ''
        working-directory: bundles
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_AUTH_TYPE: azure-cli
