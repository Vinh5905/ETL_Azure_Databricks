[project]
name = "instacart-etl"
version = "0.1.0"
description = "ETL Instacart trên Azure Databricks"
requires-python = ">=3.11,<3.12" # khớp Databricks Runtime 15.4 LTS
dependencies = [
    "pandas>=2.0,<3", # khớp nhóm API pandas của Spark 3.5
    "rapidfuzz>=3,<4",
    "requests>=2.32,<3",
    "psutil>=5.9,<7",
    "PyYAML>=6,<7",
    "mlflow>=2.17,<3",
    "pyarrow>=17,<20",
]

[project.optional-dependencies]
ingest = [
    "confluent-kafka>=2,<3",
    "pymssql>=2.3,<3",
]

[dependency-groups]
dev = [
    "pyspark>=3.5.0,<3.6", # DBR 15.4 LTS = Spark 3.5
    "pytest>=8",
    "ruff>=0.8",
    "azure-functions>=1.21,<2",
    "azure-identity>=1.17,<2",
    "azure-storage-blob>=12.22,<13",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "scripts"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
