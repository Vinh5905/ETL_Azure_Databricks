# Databricks Asset Bundles: "việc" (job, task, code). "Nền" (catalog, quyền, policy) ở infra/stacks/30-databricks.
# Workspace lấy từ DATABRICKS_HOST (CI: GitHub Variable; local: profile của `databricks auth login`).
#   databricks bundle validate -t dev
#   databricks bundle deploy   -t dev
bundle:
  name: instacart

include:
  - resources/*.yml

# Code nằm ở ../src (ngoài thư mục bundle) nên phải khai báo để được đồng bộ lên workspace.
sync:
  paths:
    - .
    - ../src

variables:
  catalog:
    description: Catalog Unity Catalog của dự án
    default: instacart
  policy_id:
    description: Cluster policy single-node (tạo ở 30-databricks), tra theo tên
    lookup:
      cluster_policy: instacart-single-node
  pipeline_policy_id:
    description: Policy riêng loại dlt cho pipeline (AD-OPS-21), không dùng policy job cluster
    lookup:
      cluster_policy: instacart-pipeline-single-node
  ds_policy_id:
    description: Policy single-node dành riêng cho benchmark DS, cho phép local[1/2/4]
    lookup:
      cluster_policy: instacart-ds-benchmark
  schema_prefix:
    description: Tiền tố schema; dev riêng từng người, prod không có tiền tố
    default: ""
  warehouse_id:
    description: Serverless SQL warehouse cho ba sql_task của job DS (resources/jobs_ds.yml)
    lookup:
      warehouse: wh-instacart-bi
  batch_email_notifications:
    description: Địa chỉ nhận lỗi và cảnh báo chạy lâu của job batch qua cấu hình deploy
    type: complex
    default: {}
  enable_off:
    description: Bật bronze và silver OFF sau khi dữ liệu crawler đã công bố trong off_root
    default: "false"
  off_root:
    description: Nhánh OFF trong volume raw; dev tách khỏi landing OFF prod
    default: /Volumes/${var.catalog}/landing_meta/raw/off_api
  off_state_schema:
    description: Schema chứa off_crawl_state; dev dùng ops riêng, prod dùng landing_meta
    default: landing_meta
  enable_baskets:
    description: Bật baskets khi hai bảng silver stream đã có trong target
    default: "false"
  enable_gold_fact:
    description: Bật fact Gold khi view orders và order_items đã có và Silver đủ dữ liệu
    default: "false"
  stream_continuous:
    description: Chạy pipeline stream liên tục khi demo, mặc định chạy từng đợt
    default: "false"
  stream_schedule_pause_status:
    description: Bật lịch prod khi Event Hubs đã sẵn sàng và pipeline chạy từng đợt
    default: PAUSED
  eh_generation:
    description: Mã thế hệ của Event Hubs, giữ nguyên khi chạy lại và đổi khi hub được tạo lại
    default: g1
  eh_region:
    description: Region Azure của Event Hubs trên Sub B
    default: koreacentral
  dbx_region:
    description: Region Azure của workspace Databricks để gắn nhãn độ trễ
    default: eastasia
  node_type_id:
    description: Máy của job cluster, phải trùng giá trị fixed trong policy (docs/devops/05 §3 bước 6)
    default: Standard_D4ds_v4
  enable_power_bi_refresh:
    description: Cho phép gọi Power BI API sau đối soát, mặc định dùng lịch refresh của BI
    default: "false"
  ci_sp_id:
    description: application_id của SP CI (= client id của UAMI id-github-ci). CI đặt qua BUNDLE_VAR_ci_sp_id.
    default: ""

targets:
  dev:
    mode: development # tiền tố [dev <user>], tạm dừng schedule
    default: true
    variables:
      schema_prefix: ${workspace.current_user.short_name}_
      off_root: /Volumes/${var.catalog}/landing_meta/raw/dev/${workspace.current_user.short_name}/off_api
      off_state_schema: ${workspace.current_user.short_name}_ops
    resources:
      pipelines:
        instacart_batch:
          configuration:
            pipelines.numUpdateRetryAttempts: "0"
            pipelines.maxFlowRetryAttempts: "0"
        instacart_stream:
          configuration:
            pipelines.numUpdateRetryAttempts: "0"
            pipelines.maxFlowRetryAttempts: "0"
      jobs:
        stream_schedule:
          schedule:
            pause_status: PAUSED

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.ci_sp_id}
    permissions:
      - level: CAN_VIEW
        group_name: users
    variables:
      # G3 prod: bật silver từ stream (baskets) và fact Gold. Chỉ chạy batch prod sau khi
      # pipeline stream prod đã tạo hai bảng stream và đã chạy create_views.sql.
      enable_baskets: "true"
      enable_gold_fact: "true"
      # Prod chưa từng đọc Event Hubs nên g1 là checkpoint mới. Mỗi lần hub được tạo lại
      # sau lượt đọc đầu, mở PR đổi mã này trước khi chạy lại stream prod.
      eh_generation: g1
