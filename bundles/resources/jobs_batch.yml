# ADF pl_master gọi job này theo ID sau khi dữ liệu landing đã công bố.
resources:
  jobs:
    batch_medallion:
      name: instacart-batch-medallion
      max_concurrent_runs: 1
      queue:
        enabled: true
      tags:
        cost_owner: p2
        task: AD-DE-18
      parameters:
        - name: adf_run_id
          default: manual
      health:
        rules:
          - metric: RUN_DURATION_SECONDS
            op: GREATER_THAN
            value: 3600
      email_notifications: ${var.batch_email_notifications}
      environments:
        - environment_key: bi_ops
          spec:
            environment_version: "4"
            dependencies: ["requests==2.34.2"]
      tasks:
        - task_key: pipeline_batch
          pipeline_task:
            pipeline_id: ${resources.pipelines.instacart_batch.id}
            full_refresh: false

        - task_key: resolve_pipeline_update
          depends_on:
            - task_key: pipeline_batch
          run_if: ALL_DONE
          max_retries: 2
          min_retry_interval_millis: 10000
          notebook_task:
            notebook_path: ../../src/tasks/run_batch_sql.py
            source: WORKSPACE
            base_parameters:
              sql_dir: ${workspace.file_path}/src/tasks
              sql_step: resolve_pipeline_update
              catalog: ${var.catalog}
              ops_schema: ${var.schema_prefix}ops
              pipeline_id: ${resources.pipelines.instacart_batch.id}
              pipeline_task_run_id: "{{tasks.pipeline_batch.run_id}}"

        - task_key: collect_dq
          depends_on:
            - task_key: resolve_pipeline_update
          notebook_task:
            notebook_path: ../../src/tasks/run_batch_sql.py
            source: WORKSPACE
            base_parameters:
              sql_dir: ${workspace.file_path}/src/tasks
              sql_step: collect_dq
              catalog: ${var.catalog}
              ops_schema: ${var.schema_prefix}ops
              event_log_table: event_log_batch
              update_id: "{{tasks.resolve_pipeline_update.values.update_id}}"

        - task_key: init_reconciliation
          depends_on:
            - task_key: pipeline_batch
            - task_key: collect_dq
          notebook_task:
            notebook_path: ../../src/tasks/run_batch_sql.py
            source: WORKSPACE
            base_parameters:
              sql_dir: ${workspace.file_path}/src/tasks
              sql_step: init_reconciliation
              catalog: ${var.catalog}
              ops_schema: ${var.schema_prefix}ops

        - task_key: reconcile
          depends_on:
            - task_key: init_reconciliation
          notebook_task:
            notebook_path: ../../src/tasks/run_batch_sql.py
            source: WORKSPACE
            base_parameters:
              sql_dir: ${workspace.file_path}/src/tasks
              sql_step: reconcile
              catalog: ${var.catalog}
              ops_schema: ${var.schema_prefix}ops
              bronze_schema: ${var.schema_prefix}bronze
              silver_schema: ${var.schema_prefix}silver
              gold_schema: ${var.schema_prefix}gold
              profile: instacart_2017
              run_id: "{{job.run_id}}"
              check_date: "{{job.start_time.iso_date}}"

        - task_key: refresh_bi
          depends_on:
            - task_key: reconcile
          run_if: ALL_SUCCESS
          max_retries: 0
          environment_key: bi_ops
          spark_python_task:
            python_file: ../../src/tasks/refresh_bi.py
            source: WORKSPACE
            parameters:
              - --catalog
              - ${var.catalog}
              - --ops-schema
              - ${var.schema_prefix}ops
              - --run-id
              - "{{job.run_id}}"
              - --adf-run-id
              - "{{job.parameters.adf_run_id}}"
              - --start-ms
              - "{{job.start_time.timestamp_ms}}"
              - --check-date
              - "{{job.start_time.iso_date}}"
              - --enabled
              - ${var.enable_power_bi_refresh}

        - task_key: record_failed_batch
          depends_on:
            - task_key: pipeline_batch
            - task_key: resolve_pipeline_update
            - task_key: collect_dq
            - task_key: init_reconciliation
            - task_key: reconcile
          run_if: AT_LEAST_ONE_FAILED
          environment_key: bi_ops
          spark_python_task:
            python_file: ../../src/tasks/refresh_bi.py
            source: WORKSPACE
            parameters:
              - --catalog
              - ${var.catalog}
              - --ops-schema
              - ${var.schema_prefix}ops
              - --run-id
              - "{{job.run_id}}"
              - --adf-run-id
              - "{{job.parameters.adf_run_id}}"
              - --start-ms
              - "{{job.start_time.timestamp_ms}}"
              - --check-date
              - "{{job.start_time.iso_date}}"
              - --mode
              - audit_failed
