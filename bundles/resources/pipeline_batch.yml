# Classic single-node theo chốt G0; runtime do channel quản lý, không đặt spark_version.
resources:
  pipelines:
    instacart_batch:
      name: instacart-batch
      catalog: ${var.catalog}
      schema: ${var.schema_prefix}bronze
      edition: ADVANCED
      channel: CURRENT
      serverless: false
      continuous: false
      photon: false
      clusters:
        - label: default
          policy_id: ${var.pipeline_policy_id}
          node_type_id: ${var.node_type_id}
          num_workers: 0
          spark_conf:
            spark.databricks.cluster.profile: singleNode
          custom_tags:
            cost_owner: p2
      configuration:
        landing_root: /Volumes/${var.catalog}/landing_meta/raw
        off_root: ${var.off_root}
        enable_off: ${var.enable_off}
        catalog: ${var.catalog}
        bronze: ${var.schema_prefix}bronze
        silver: ${var.schema_prefix}silver
        gold: ${var.schema_prefix}gold
        ops: ${var.schema_prefix}ops
        as_of_date: "2026-03-30"
        spark.sql.session.timeZone: UTC
        enable_baskets: ${var.enable_baskets}
        pipelines.clusterShutdown.delay: 60s
      event_log:
        catalog: ${var.catalog}
        schema: ${var.schema_prefix}ops
        name: event_log_batch
      # Đưa src vào sys.path để các tầng sau import common, không nạp pipeline stream.
      root_path: ../../src
      libraries:
        - glob:
            include: ../../src/pipelines/batch/**
