resources:
  jobs:
    benchmark_formats:
      name: instacart-benchmark-formats
      max_concurrent_runs: 1
      timeout_seconds: 5400
      tags:
        cost_owner: p2
        task: AD-DE-26
      tasks:
        - task_key: benchmark_formats
          job_cluster_key: single_node
          max_retries: 0
          spark_python_task:
            python_file: ../../src/tasks/benchmark_formats.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --silver-schema
              - ${var.schema_prefix}silver
              - --ops-schema
              - ${var.schema_prefix}ops
              - --run-id
              - "{{job.run_id}}"
              - --node-type
              - ${var.node_type_id}
              - --runtime
              - "15.4.x-scala2.12"
      job_clusters:
        - job_cluster_key: single_node
          new_cluster:
            policy_id: ${var.policy_id}
            spark_version: 15.4.x-scala2.12
            node_type_id: ${var.node_type_id}
            num_workers: 0
            data_security_mode: SINGLE_USER
            spark_conf:
              spark.databricks.cluster.profile: singleNode
              spark.master: "local[*]"
              spark.databricks.io.cache.enabled: "false"
            custom_tags:
              ResourceClass: SingleNode
              cost_owner: p2
