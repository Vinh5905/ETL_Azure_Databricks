# Classic single-node theo G0. Runtime do channel quản lý.
resources:
  pipelines:
    instacart_stream:
      name: instacart-stream
      catalog: ${var.catalog}
      schema: ${var.schema_prefix}bronze
      edition: ADVANCED
      channel: CURRENT
      serverless: false
      continuous: ${var.stream_continuous}
      photon: false
      clusters:
        - label: default
          policy_id: ${var.pipeline_policy_id}
          node_type_id: ${var.node_type_id}
          num_workers: 0
          spark_conf:
            spark.databricks.cluster.profile: singleNode
          custom_tags:
            cost_owner: p3
      configuration:
        catalog: ${var.catalog}
        bronze: ${var.schema_prefix}bronze
        silver: ${var.schema_prefix}silver
        gold: ${var.schema_prefix}gold
        ops: ${var.schema_prefix}ops
        eh_topic: orders-stream
        eh_generation: ${var.eh_generation}
        eh_region: ${var.eh_region}
        dbx_region: ${var.dbx_region}
        spark.sql.session.timeZone: UTC
        pipelines.clusterShutdown.delay: 60s
      event_log:
        catalog: ${var.catalog}
        schema: ${var.schema_prefix}ops
        name: event_log_stream
      root_path: ../../src
      libraries:
        - glob:
            include: ../../src/pipelines/stream/**

  jobs:
    stream_schedule:
      name: instacart-stream-15m
      max_concurrent_runs: 1
      queue:
        enabled: false
      tags:
        cost_owner: p3
        task: AD-ST-03
      schedule:
        # Không lên lịch lượt mới trong khung batch 02:00–03:00 giờ Việt Nam.
        quartz_cron_expression: "0 0/15 0-1,3-23 * * ?"
        timezone_id: Asia/Ho_Chi_Minh
        pause_status: ${var.stream_schedule_pause_status}
      tasks:
        - task_key: run_stream
          pipeline_task:
            pipeline_id: ${resources.pipelines.instacart_stream.id}
            full_refresh: false
